name: Daily TRMNL Refresh
# Die Recipe rechnet ihren Tagesindex selbst aus der lokalen Zeit aus. Sie
# liest last_updated nicht - aber der Zeitstempel ist trotzdem das, was den
# Wechsel ausloest: ohne geaenderte Nutzdaten erzeugt TRMNL keinen neuen
# Screen. Dieser Lauf darf also nicht entfallen.
on:
  schedule:
    # 23:05 UTC = 00:05 MEZ im Winter, 01:05 MESZ im Sommer, also ganzjaehrig
    # kurz nach lokaler Mitternacht. Genau dann wechselt das Display: TRMNL
    # erzeugt einen Screen nur neu, wenn sich die Nutzdaten geaendert haben
    # ("skips generating screens if the merge variables are the same between
    # requests"). Der Zeitstempel unten ist hier die einzige Aenderung an den
    # Nutzdaten - er ist also nicht kosmetisch, sondern traegt den Wechsel.
    # (Vorher '0 * * * *' - stuendlich, trotz des Kommentars "Midnight UTC".)
    - cron: '5 23 * * *'
  workflow_dispatch: # Allows manual testing button

concurrency:
  group: habedere-schreibt
  cancel-in-progress: false

jobs:
  update-timestamp:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update Timestamp
        run: |
          python3 -c "import json, time; f=open('habedere.json','r+', encoding='utf-8'); d=json.load(f); d['last_updated']=time.time(); f.seek(0); json.dump(d, f, indent=2, ensure_ascii=False); f.write('\n'); f.truncate()"
      - name: Commit and Push
        run: |
          git config user.name "TRMNL Bot"
          git config user.email "actions@github.com"
          git add habedere.json
          # Only commit if changed
          git diff --quiet && git diff --staged --quiet || (git commit -m "Daily refresh" && git push)
