name: Daily TRMNL Refresh
# Die Recipe rechnet ihren Tagesindex selbst aus der lokalen Zeit aus und
# liest last_updated gar nicht. Dieser Lauf haelt nur den Zeitstempel frisch;
# er koennte auch ganz entfallen.
on:
  schedule:
    # 00:05 UTC, einmal taeglich. Vorher stand hier '0 * * * *' - das war
    # stuendlich, trotz des Kommentars "Midnight UTC".
    - cron: '5 0 * * *'
  workflow_dispatch: # Allows manual testing button

concurrency:
  group: habedere-schreibt
  cancel-in-progress: false

jobs:
  update-timestamp:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update Timestamp
        run: |
          python3 -c "import json, time; f=open('habedere.json','r+', encoding='utf-8'); d=json.load(f); d['last_updated']=time.time(); f.seek(0); json.dump(d, f, indent=2, ensure_ascii=False); f.write('\n'); f.truncate()"
      - name: Commit and Push
        run: |
          git config user.name "TRMNL Bot"
          git config user.email "actions@github.com"
          git add habedere.json
          # Only commit if changed
          git diff --quiet && git diff --staged --quiet || (git commit -m "Daily refresh" && git push)
